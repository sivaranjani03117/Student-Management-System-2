<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🎓</div>
      <h1>Student Management System</h1>
      <p>College Project Portal & Database</p>
    </div>

    <div class="login-body-content">
      <div class="demo-credentials-box">
        <p><strong>💡 Quick Demo Credentials:</strong></p>
        <p style="margin-top: 4px; color: #475569;">
          Username: <strong>admin</strong> | Password: <strong>admin123</strong>
        </p>
        <button type="button" class="btn-demo-fill" onclick="fillDemo('admin', 'admin123')">
          ⚡ Auto-fill Admin Login
        </button>
      </div>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="username">Username <span class="required">*</span></label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username (e.g. admin)" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="password">Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 12px; color: #94a3b8;">
        Connected to local MongoDB (<strong>studentManagementDB</strong>)
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="script.js"></script>
</body>
</html>
